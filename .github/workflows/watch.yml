name: Doomsday ticket watch

on:
  schedule:
    - cron: "*/5 * * * *"   # start a run every 5 min; each run checks every minute for ~20 min
  workflow_dispatch:         # lets you run it by hand from the Actions tab
    inputs:
      test:
        description: "Only send a test notification to my phone"
        type: boolean
        default: false

permissions:
  contents: write            # so it can save what it has already alerted about

concurrency:              # one run at a time; the next one waits its turn
  group: doomsday-watch      # (extra waiting runs show as "cancelled" - that's normal)
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Africa/Cairo       # show log times in Cairo time
    steps:
      - uses: actions/checkout@v5

      - name: Check Scene District 5
        run: python3 doomsday_watch.py ${{ inputs.test && '--test' || '--ci' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain .doomsday_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .doomsday_state.json
            git commit -m "Update watcher state"
            git push || echo "Could not save state this time"
          fi
